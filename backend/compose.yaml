services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avishkar
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: avishkar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avishkar -d avishkar"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://avishkar:local-development@db:5432/avishkar
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
